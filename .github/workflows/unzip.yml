name: Fix assets and unzip images
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets
          for f in style.css search.js article.js search-index.json articles.json; do
            [ -f "$f" ] && git mv "$f" "assets/$f" || true
          done
          unzip -o oa-kb-images.zip -d assets/
          rm -f oa-kb-images.zip oa-kb-site.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Move assets into assets/ and extract images"
          git push
