# Kristy (or anyone) describes a change in a GitHub issue; Claude edits the
# markdown, the site is rebuilt, and a pull request opens for review.
#
# Nothing reaches the live site without a human merging. That is the whole point
# of the shape: the model does the typing, a person keeps the final say.
#
# To use it: open an issue with the "Knowledge base change" template and add the
# label kb-change. Removing and re-adding the label runs it again.
#
# Requires one repository secret: ANTHROPIC_API_KEY.
name: KB update from an issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      change:
        description: 'Describe the change in plain English'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update:
    # Only the kb-change label triggers this; every other label is ignored.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'kb-change'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install markdown beautifulsoup4 lxml

      - name: Work out what was asked for
        id: ask
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MANUAL: ${{ github.event.inputs.change }}
        run: |
          if [ -n "$MANUAL" ]; then
            REQUEST="$MANUAL"
          else
            REQUEST="$ISSUE_TITLE. $ISSUE_BODY"
          fi
          # Passed through a file, not an argument: a request containing quotes or
          # newlines would otherwise be mangled or, worse, run as shell.
          printf '%s' "$REQUEST" > .kb-request.txt
          echo "Request recorded ($(wc -c < .kb-request.txt) bytes)"

      - name: Ask Claude to make the edit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KB_UPDATE_NO_GIT: '1'
        run: node scripts/update-article.js "$(cat .kb-request.txt)"

      - name: Stop if nothing was edited
        id: edited
        run: |
          if [ ! -s kb-update-edited.txt ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No article was changed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat kb-update-edited.txt
          fi

      - name: Rebuild the site
        if: steps.edited.outputs.changed == 'true'
        run: python build.py

      - name: Run the checks before opening anything
        if: steps.edited.outputs.changed == 'true'
        run: python scripts/checks.py

      # Everything from the issue arrives through env and files, never through
      # ${{ }} inside a run block. Interpolating an issue body straight into shell
      # lets anyone who can open an issue run commands on the runner - and this
      # workflow holds an Anthropic key and a write token.
      - name: Open a pull request
        if: steps.edited.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="kb-update-${{ github.run_id }}"
          {
            echo "Requested:"
            echo
            sed 's/^/> /' .kb-request.txt
            echo
            echo
            echo "Edited by Claude, rebuilt, and all checks passed."
            echo
            echo "**Please read the diff before merging.** The wording has been changed by a model and nobody has looked at it yet."
          } > .kb-pr-body.md
          rm -f .kb-request.txt kb-update-edited.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add -A -- ':!.kb-pr-body.md'
          git commit -m "KB update requested in issue #${ISSUE_NUMBER:-manual}"
          git push -u origin "$BRANCH"
          gh pr create --title "KB update: issue #${ISSUE_NUMBER:-manual}" \
            --body-file .kb-pr-body.md --base main --head "$BRANCH"

      - name: Say so on the issue if nothing matched
        if: steps.edited.outputs.changed == 'false' && github.event.issue.number
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body \
            "No existing article covered this, so nothing was changed. It may need a new article writing - or the request may need to name the feature more specifically."
