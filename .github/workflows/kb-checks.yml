# The standing check suite, run on every push to main and on any pull request.
#
# Kristy edits the help centre by talking to Claude on her own machine, and Claude
# runs build.py and checks.py there before committing - so by the time anything
# reaches GitHub it has already been checked once. This is the second pair of eyes,
# for the times that did not happen: a push from a machine without Python, a
# hand-edit, a bad merge.
#
# On main it is an alarm rather than a gate - the change is already live by the
# time this finishes. That is the accepted trade for letting one person publish
# without ceremony. Everything is in git, so anything this catches can be reverted
# in a single revert commit.
name: KB checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the build dependencies
        run: pip install markdown beautifulsoup4 lxml

      - name: Rebuild the site from the markdown
        run: python build.py

      - name: The committed HTML must match the markdown
        run: |
          if ! git diff --quiet; then
            echo "::error::The published pages do not match the markdown. Someone edited corpus/ without rebuilding, so the live site is not showing the change. Run 'py build.py' and commit the result."
            git diff --stat
            exit 1
          fi
          echo "Published pages match the markdown."

      - name: Run the standing check suite
        run: python scripts/checks.py
